services:
  - type: web
    name: bmmarket-backend
    env: docker
    plan: free
    rootDir: backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # Set this manually in the Render dashboard
      - key: JWT_SECRET
        sync: false # Set this manually in the Render dashboard
      - key: JWT_EXPIRES_IN
        value: 1d

  - type: web
    name: bmmarket-frontend
    env: docker
    plan: free
    rootDir: frontend
    envVars:
      - key: NODE_ENV
        value: production
